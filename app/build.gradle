plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.ishgrafigi'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.ishgrafigi'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
